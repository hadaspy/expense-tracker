<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhatTheFund</title>
  <meta name="description" content="WhatTheFund: your money, on your own Google Sheet">

  <!-- Installable on the home screen -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="WhatTheFund">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="theme-color" content="#e8edfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070c1c" media="(prefers-color-scheme: dark)">

  <!-- Never send this page's address to other sites -->
  <meta name="referrer" content="no-referrer">

  <!-- Start the connection to Google early: the API answers from script.google.com and redirects to googleusercontent.com -->
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">

  <link rel="preload" href="fonts/poppins-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/poppins-600.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Light or dark before the first paint (no white flash): the saved choice, else the iPhone's setting -->
  <script>
    (function () {
      var choice = 'auto';
      try { choice = JSON.parse(localStorage.getItem('expense-tracker.appearance')) || 'auto'; } catch (e) {}
      var dark = choice === 'dark' || (choice === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <noscript><p class="empty">This app needs JavaScript.</p></noscript>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
